# Backend de AgroGanaderíaPro en Render (plan gratis).
# DATABASE_URL (Session pooler de Supabase) se pone a mano en el panel de Render.
services:
  - type: web
    name: agroganaderiapro-api
    runtime: docker
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
