# Mantiene activos Supabase (plan gratis se pausa tras ~7 días sin uso)
# y el backend. Corre cada 2 días y también se puede lanzar a mano.
name: Keep alive (Supabase + backend)
on:
  schedule:
    - cron: "17 13 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend con consulta real a la base de datos
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://agroganaderiapro-backend-944496395089.us-central1.run.app/health/db)
            echo "Intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::El backend o la base de datos no responden"
          exit 1
